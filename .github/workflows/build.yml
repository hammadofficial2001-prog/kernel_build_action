name: Build Surya OC Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    permissions:
      contents: read

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: andrey167/kernel_xiaomi_surya-msm
          ref: main
          fetch-depth: 0

      - name: Verify source
        run: |
          echo "Repository:"
          git remote -v
          echo "Current commit:"
          git rev-parse HEAD
          echo "Recent commits:"
          git log --oneline -5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            flex \
            build-essential \
            libssl-dev \
            libelf-dev \
            python3 \
            cpio \
            rsync \
            device-tree-compiler \
            clang \
            lld \
            llvm

      - name: Find Surya defconfig
        run: |
          set -e

          echo "Searching for Surya defconfig..."

          for cfg in \
            surya_defconfig \
            vendor/surya_defconfig \
            vendor/xiaomi/surya_defconfig \
            sm6150_defconfig \
            sm7150_defconfig
          do
            if [ -f "arch/arm64/configs/$cfg" ]; then
              echo "Found: $cfg"
              echo "DEFCONFIG=$cfg" >> "$GITHUB_ENV"
              exit 0
            fi
          done

          echo "ERROR: No compatible Surya defconfig found."
          exit 1

      - name: Prepare kernel configuration
        run: |
          set -e

          mkdir -p out

          echo "Using defconfig: $DEFCONFIG"

          make O=out ARCH=arm64 "$DEFCONFIG"

          make O=out ARCH=arm64 olddefconfig

          echo "Kernel configuration prepared."

      - name: Build kernel
        run: |
          set -e

          export ARCH=arm64
          export SUBARCH=arm64
          export LLVM=1
          export LLVM_IAS=1

          echo "Starting kernel compilation..."

          make \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            -j"$(nproc)"

      - name: Check kernel output
        run: |
          set -e

          echo "Kernel output files:"
          find out/arch/arm64/boot \
            -maxdepth 2 \
            -type f \
            -printf '%p\n' | sort

          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            echo "KERNEL_IMAGE=Image.gz-dtb" >> "$GITHUB_ENV"
          elif [ -f out/arch/arm64/boot/Image.gz ]; then
            echo "KERNEL_IMAGE=Image.gz" >> "$GITHUB_ENV"
          elif [ -f out/arch/arm64/boot/Image ]; then
            echo "KERNEL_IMAGE=Image" >> "$GITHUB_ENV"
          else
            echo "ERROR: Kernel image was not generated."
            exit 1
          fi

          echo "Selected kernel: $KERNEL_IMAGE"

      - name: Create release package
        run: |
          set -e

          mkdir -p release

          cp "out/arch/arm64/boot/$KERNEL_IMAGE" \
            "release/$KERNEL_IMAGE"

          if [ -f out/System.map ]; then
            cp out/System.map release/System.map
          fi

          cp out/.config release/kernel.config

          if [ -f out/vmlinux ]; then
            cp out/vmlinux release/vmlinux
          fi

          cd release
          sha256sum * > SHA256SUMS
          cd ..

          zip -9 -r \
            Surya-OC-Kernel-54d2de1.zip \
            release

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: Surya-OC-Kernel-54d2de1
          path: |
            Surya-OC-Kernel-54d2de1.zip
