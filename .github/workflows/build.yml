name: Surya Exact OPP Check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-22.04

    permissions:
      contents: read

    steps:
      - name: Checkout Surya Kernel
        uses: actions/checkout@v4
        with:
          repository: stormbreaker-project/kernel_xiaomi_surya
          ref: staging/main
          path: kernel

      - name: Check Exact Surya CPU GPU OPP
        shell: bash
        run: |
          set -u
          cd kernel

          echo "===== CPU: sm6150.dtsi ====="
          grep -n -B 8 -A 12 -E \
            '1804800|2304000|2457600|opp-hz|opp-microvolt' \
            arch/arm64/boot/dts/qcom/sm6150.dtsi \
            || true

          echo
          echo "===== GPU: sm6150-gpu.dtsi ====="
          grep -n -B 8 -A 12 -E \
            '800000000|650000000|565000000|430000000|355000000|267000000|180000000|opp-hz|opp-microvolt' \
            arch/arm64/boot/dts/qcom/sm6150-gpu.dtsi \
            || true

          echo
          echo "===== CPU FREQUENCY TABLE ====="
          grep -n -B 5 -A 20 -E \
            '1804800|2304000|cpu-freq|cpufreq' \
            arch/arm64/boot/dts/qcom/sm6150.dtsi \
            || true

          echo
          echo "===== GPU FREQUENCY TABLE ====="
          grep -n -B 5 -A 20 -E \
            '800000000|650000000|565000000|430000000|freq-table|gpu' \
            arch/arm64/boot/dts/qcom/sm6150-gpu.dtsi \
            || true

          echo
          echo "===== DONE ====="
