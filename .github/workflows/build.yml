name: Surya Real OPP Scan

on:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-22.04

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: stormbreaker-project/kernel_xiaomi_surya
          ref: staging/main
          path: kernel

      - name: Scan Real OPP Tables
        run: |
          cd kernel

          echo "===== CPU OPP REFERENCES ====="
          grep -RniE \
            'opp-hz|opp-supported-hw|opp-microvolt|operating-points-v2|cpu[0-9].*opp|cpu.*freq' \
            arch/arm64/boot/dts/qcom/sm6150.dtsi \
            arch/arm64/boot/dts/qcom/sm6150.dts \
            | head -n 300 || true

          echo
          echo "===== GPU OPP ====="
          grep -RniE \
            'opp-hz|opp-microvolt|800000000|650000000|565000000|430000000|355000000|267000000|180000000' \
            arch/arm64/boot/dts/qcom/sm6150-gpu.dtsi \
            | head -n 300 || true

          echo
          echo "===== CPU CLOCK VALUES ====="
          grep -RniE \
            '1804800|2304000|2457600|2400000|2500000' \
            arch/arm64/boot/dts/qcom/sm6150.dtsi \
            arch/arm64/boot/dts/qcom/sm6150.dts \
            | head -n 200 || true
