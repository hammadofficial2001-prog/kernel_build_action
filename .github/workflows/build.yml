name: Build POCO X3 NFC Surya Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    permissions:
      contents: read

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential flex git \
            libssl-dev libelf-dev \
            python3 ccache zip unzip rsync \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            lld clang

      - name: Clone POCO X3 NFC Surya kernel
        run: |
          git clone --depth=1 \
            -b staging/LA.UM.9.x \
            https://github.com/Stratosphere-Kernel/android_kernel_xiaomi_surya.git \
            kernel

      - name: Get Neutron Clang
        run: |
          mkdir -p "$HOME/toolchains/neutron-clang"
          cd "$HOME/toolchains/neutron-clang"

          curl -LO https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman
          chmod +x antman

          ./antman -S

          echo "$HOME/toolchains/neutron-clang/bin" >> "$GITHUB_PATH"

      - name: Verify Surya source
        run: |
          cd kernel

          test -f arch/arm64/configs/surya_defconfig

          echo "=============================="
          echo "POCO X3 NFC SURYA SOURCE OK"
          echo "DEFCONFIG: surya_defconfig"
          echo "=============================="

          git log -1 --oneline

      - name: Build kernel
        run: |
          cd kernel

          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$HOME/toolchains/neutron-clang/bin:$PATH"

          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          make O=out \
            surya_defconfig \
            CC=clang \
            LD=ld.lld \
            AS=llvm-as \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip

          make -j"$(nproc)" O=out \
            CC=clang \
            LD=ld.lld \
            AS=llvm-as \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            LLVM=1

      - name: Verify build
        run: |
          test -f kernel/out/arch/arm64/boot/Image

          echo "=============================="
          echo "KERNEL BUILD SUCCESS"
          echo "=============================="

          ls -lh kernel/out/arch/arm64/boot/Image

      - name: Package artifact
        run: |
          mkdir -p release

          cp kernel/out/arch/arm64/boot/Image release/Image
          cp kernel/out/.config release/kernel.config

          if [ -f kernel/out/System.map ]; then
            cp kernel/out/System.map release/System.map
          fi

          sha256sum release/* > release/SHA256SUMS

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: POCO-X3-NFC-Surya-Kernel
          path: release/
