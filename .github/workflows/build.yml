name: Surya OPP Extract

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-22.04

    permissions:
      contents: read

    steps:
      - name: Checkout Kernel
        uses: actions/checkout@v4
        with:
          repository: stormbreaker-project/kernel_xiaomi_surya
          ref: staging/main
          path: kernel

      - name: Extract Exact OPP Data
        run: |
          cd kernel

          {
            echo "===== CPU sm6150.dtsi ====="
            grep -n -B 8 -A 12 -E \
              '1804800|2304000|2457600|opp-hz|opp-microvolt' \
              arch/arm64/boot/dts/qcom/sm6150.dtsi || true

            echo
            echo "===== GPU sm6150-gpu.dtsi ====="
            grep -n -B 8 -A 12 -E \
              '800000000|650000000|565000000|430000000|355000000|267000000|180000000|opp-hz|opp-microvolt' \
              arch/arm64/boot/dts/qcom/sm6150-gpu.dtsi || true

            echo
            echo "===== CPU FREQUENCY ====="
            grep -n -B 5 -A 20 -E \
              '1804800|2304000|cpufreq' \
              arch/arm64/boot/dts/qcom/sm6150.dtsi || true

            echo
            echo "===== GPU FREQUENCY ====="
            grep -n -B 5 -A 20 -E \
              '800000000|650000000|565000000|430000000|freq-table|gpu' \
              arch/arm64/boot/dts/qcom/sm6150-gpu.dtsi || true
          } > ../surya-opp.txt

          echo "===== RESULT ====="
          cat ../surya-opp.txt

      - name: Upload OPP Report
        uses: actions/upload-artifact@v4
        with:
          name: surya-opp-report
          path: surya-opp.txt
