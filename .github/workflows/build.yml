name: Diagnose Surya Kernel OPP

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout StormBreaker
        uses: actions/checkout@v4
        with:
          repository: stormbreaker-project/kernel_xiaomi_surya
          ref: staging/main
          path: kernel

      - name: Search CPU GPU OPP
        run: |
          cd kernel

          echo "========== KERNEL =========="
          git log -1 --oneline
          echo

          echo "========== DEFCONFIG =========="
          find arch/arm64/configs -type f | grep -Ei 'surya|sm6150' || true
          echo

          echo "========== CPU FREQUENCY =========="
          grep -RniE '2304000|1804800|cpu.?opp|opp-hz|opp-microvolt|opp-supported-hw' \
            arch/arm64/boot/dts 2>/dev/null | head -300 || true
          echo

          echo "========== GPU FREQUENCY =========="
          grep -RniE '800000000|650000000|565000000|gpu.*opp|opp-hz|opp-microvolt|kgsl' \
            arch/arm64/boot/dts 2>/dev/null | head -300 || true
          echo

          echo "========== KGSL =========="
          grep -RniE '800000000|650000000|565000000|gpu_available_frequencies|freq_table' \
            drivers 2>/dev/null | head -300 || true
          echo

          echo "========== DTS FILES =========="
          find arch/arm64/boot/dts -type f | grep -Ei 'sm6150|surya|gpu|cpu' | head -300 || true
