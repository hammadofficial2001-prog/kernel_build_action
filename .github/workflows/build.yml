name: Build Surya OC Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    permissions:
      contents: read

    steps:

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: andrey167/kernel_xiaomi_surya-msm
          ref: main
          fetch-depth: 0

      - name: Show source information
        run: |
          set -e

          echo "================================="
          echo "SOURCE COMMIT"
          echo "================================="

          git rev-parse HEAD
          git log --oneline -10

          echo "================================="
          echo "CHECKING OC SOURCE"
          echo "================================="

          grep -Rni \
            "OVERCLOCK\|2133\|895000000" \
            arch/arm64/boot/dts/qcom \
            2>/dev/null || true

      - name: Install dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            flex \
            build-essential \
            libssl-dev \
            libelf-dev \
            python3 \
            cpio \
            rsync \
            device-tree-compiler \
            clang \
            lld \
            llvm \
            git \
            curl \
            unzip

      - name: Download KernelSU
        run: |
          set -e

          echo "================================="
          echo "DOWNLOADING KERNELSU"
          echo "================================="

          mkdir -p drivers

          curl -L --fail \
            https://github.com/tiann/KernelSU/archive/refs/heads/main.tar.gz \
            -o /tmp/kernelsu.tar.gz

          ls -lh /tmp/kernelsu.tar.gz

          rm -rf /tmp/kernelsu
          mkdir -p /tmp/kernelsu

          tar -xzf \
            /tmp/kernelsu.tar.gz \
            -C /tmp/kernelsu

          KSU_DIR=$(find /tmp/kernelsu \
            -maxdepth 1 \
            -type d \
            -name 'KernelSU-*' \
            | head -n 1)

          if [ -z "$KSU_DIR" ]; then
            echo "ERROR: KernelSU directory not found."
            exit 1
          fi

          echo "KernelSU source:"
          echo "$KSU_DIR"

          rm -rf drivers/kernelsu

          cp -a \
            "$KSU_DIR" \
            drivers/kernelsu

          echo "================================="
          echo "KERNELSU STRUCTURE"
          echo "================================="

          find drivers/kernelsu/kernel \
            -maxdepth 2 \
            -type f \
            | sort \
            | head -100

      - name: Prepare KernelSU kernel layout
        run: |
          set -e

          echo "================================="
          echo "PREPARING KERNELSU KERNEL LAYOUT"
          echo "================================="

          test -f drivers/kernelsu/kernel/Kconfig
          test -f drivers/kernelsu/kernel/Kbuild

          echo "KernelSU kernel/Kconfig found."

          # This kernel's drivers/Kconfig expects:
          # drivers/kernelsu/Kconfig
          #
          # Current KernelSU stores the kernel integration inside:
          # drivers/kernelsu/kernel/Kconfig
          #
          # Copy the kernel integration files into the location
          # expected by this kernel tree.

          cp -a \
            drivers/kernelsu/kernel/. \
            drivers/kernelsu/

          echo "Checking expected Kconfig..."

          if [ ! -f drivers/kernelsu/Kconfig ]; then
            echo "ERROR: drivers/kernelsu/Kconfig still missing."
            exit 1
          fi

          echo "SUCCESS:"
          ls -lh drivers/kernelsu/Kconfig

      - name: Check KernelSU Kconfig entry
        run: |
          set -e

          echo "================================="
          echo "KERNELSU KCONFIG CHECK"
          echo "================================="

          grep -n "kernelsu" drivers/Kconfig || true

          echo "Top-level KernelSU Kconfig:"
          head -80 drivers/kernelsu/Kconfig

      - name: Find Surya defconfig
        run: |
          set -e

          echo "================================="
          echo "FINDING SURYA DEFCONFIG"
          echo "================================="

          for cfg in \
            surya_defconfig \
            vendor/surya_defconfig \
            vendor/xiaomi/surya_defconfig \
            sm6150_defconfig \
            sm7150_defconfig
          do
            if [ -f "arch/arm64/configs/$cfg" ]; then
              echo "Found:"
              echo "$cfg"

              echo "DEFCONFIG=$cfg" >> "$GITHUB_ENV"

              exit 0
            fi
          done

          echo "ERROR: No compatible Surya defconfig found."

          find arch/arm64/configs \
            -maxdepth 3 \
            -type f \
            | grep -Ei \
              'surya|sm6150|sm7150' \
            || true

          exit 1

      - name: Prepare kernel configuration
        run: |
          set -e

          echo "================================="
          echo "PREPARING KERNEL CONFIG"
          echo "================================="

          rm -rf out

          mkdir -p out

          make \
            O=out \
            ARCH=arm64 \
            "$DEFCONFIG"

          make \
            O=out \
            ARCH=arm64 \
            olddefconfig

          echo "Configuration completed."

      - name: Verify configuration
        run: |
          set -e

          echo "================================="
          echo "CONFIG VERIFICATION"
          echo "================================="

          grep -E \
            'CONFIG_KSU|CONFIG_KPROBES|CONFIG_OVERLAY_FS' \
            out/.config \
            || true

          echo "Config lines:"
          wc -l out/.config

      - name: Build kernel
        run: |
          set -e

          export ARCH=arm64
          export SUBARCH=arm64

          export LLVM=1
          export LLVM_IAS=1

          echo "================================="
          echo "BUILDING SURYA KERNEL"
          echo "================================="

          make \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            -j"$(nproc)"

      - name: Check kernel image
        run: |
          set -e

          echo "================================="
          echo "KERNEL OUTPUT"
          echo "================================="

          find out/arch/arm64/boot \
            -maxdepth 2 \
            -type f \
            -printf '%p\n' \
            | sort

          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then

            echo "KERNEL_IMAGE=Image.gz-dtb" >> "$GITHUB_ENV"

          elif [ -f out/arch/arm64/boot/Image.gz ]; then

            echo "KERNEL_IMAGE=Image.gz" >> "$GITHUB_ENV"

          elif [ -f out/arch/arm64/boot/Image ]; then

            echo "KERNEL_IMAGE=Image" >> "$GITHUB_ENV"

          else

            echo "ERROR: No kernel image generated."

            exit 1

          fi

          echo "Selected image:"
          echo "$KERNEL_IMAGE"

      - name: Verify OC source
        run: |
          set -e

          echo "================================="
          echo "OC VERIFICATION"
          echo "================================="

          grep -Rni \
            "OVERCLOCK\|2133\|895000000" \
            arch/arm64/boot/dts/qcom \
            2>/dev/null \
            || true

          echo "Generated image:"
          ls -lh \
            "out/arch/arm64/boot/$KERNEL_IMAGE"

      - name: Create package
        run: |
          set -e

          rm -rf release

          mkdir -p release

          cp \
            "out/arch/arm64/boot/$KERNEL_IMAGE" \
            release/

          if [ -f out/System.map ]; then
            cp out/System.map release/
          fi

          if [ -f out/vmlinux ]; then
            cp out/vmlinux release/
          fi

          cp \
            out/.config \
            release/kernel.config

          cd release

          sha256sum * > SHA256SUMS

          cd ..

          zip -9 -r \
            Surya-OC-Kernel.zip \
            release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Surya-OC-Kernel
          path: Surya-OC-Kernel.zip
          if-no-files-found: error
