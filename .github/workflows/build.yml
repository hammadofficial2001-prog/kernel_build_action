name: Build Surya OC Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    permissions:
      contents: read

    steps:

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: andrey167/kernel_xiaomi_surya-msm
          ref: main
          fetch-depth: 0

      - name: Show source commit
        run: |
          set -e

          echo "================================="
          echo "SOURCE COMMIT"
          echo "================================="

          git rev-parse HEAD
          git log --oneline -10

      - name: Install dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            flex \
            build-essential \
            libssl-dev \
            libelf-dev \
            python3 \
            cpio \
            rsync \
            device-tree-compiler \
            gcc \
            g++ \
            git \
            curl \
            unzip \
            binutils-aarch64-linux-gnu \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi

      - name: Download Clang
        run: |
          set -e

          mkdir -p "$HOME/toolchains"

          git clone \
            --depth=1 \
            https://github.com/llvm/llvm-project.git \
            "$HOME/toolchains/llvm-project"

          cd "$HOME/toolchains/llvm-project"

          git checkout llvmorg-12.0.1

          mkdir -p build

          cmake -S llvm -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_ENABLE_PROJECTS="clang;lld" \
            -DLLVM_TARGETS_TO_BUILD="AArch64;ARM;X86" \
            -DCMAKE_INSTALL_PREFIX="$HOME/toolchains/clang"

          cmake --build build \
            --target clang lld \
            -j"$(nproc)"

          cmake --install build

      - name: Check toolchain
        run: |
          set -e

          export PATH="$HOME/toolchains/clang/bin:$PATH"

          echo "================================="
          echo "CLANG"
          echo "================================="

          clang --version
          ld.lld --version

          echo "================================="
          echo "ARM64 GCC"
          echo "================================="

          aarch64-linux-gnu-gcc --version

          echo "================================="
          echo "ARM32 GCC"
          echo "================================="

          arm-linux-gnueabi-gcc --version

      - name: Download KernelSU
        run: |
          set -e

          mkdir -p drivers

          curl -L --fail \
            https://github.com/tiann/KernelSU/archive/refs/heads/main.tar.gz \
            -o /tmp/kernelsu.tar.gz

          rm -rf /tmp/kernelsu
          mkdir -p /tmp/kernelsu

          tar -xzf \
            /tmp/kernelsu.tar.gz \
            -C /tmp/kernelsu

          KSU_DIR=$(find /tmp/kernelsu \
            -maxdepth 1 \
            -type d \
            -name 'KernelSU-*' \
            | head -n 1)

          if [ -z "$KSU_DIR" ]; then
            echo "ERROR: KernelSU directory not found."
            exit 1
          fi

          rm -rf drivers/kernelsu

          cp -a \
            "$KSU_DIR" \
            drivers/kernelsu

          if [ ! -f drivers/kernelsu/kernel/Kconfig ]; then
            echo "ERROR: KernelSU kernel/Kconfig missing."
            exit 1
          fi

          cp -a \
            drivers/kernelsu/kernel/. \
            drivers/kernelsu/

          test -f drivers/kernelsu/Kconfig

          echo "KernelSU ready."

      - name: Find Surya defconfig
        run: |
          set -e

          for cfg in \
            surya_defconfig \
            vendor/surya_defconfig \
            vendor/xiaomi/surya_defconfig \
            sm6150_defconfig \
            sm7150_defconfig
          do
            if [ -f "arch/arm64/configs/$cfg" ]; then
              echo "DEFCONFIG=$cfg" >> "$GITHUB_ENV"
              echo "Using $cfg"
              exit 0
            fi
          done

          echo "ERROR: Surya defconfig not found."
          exit 1

      - name: Prepare configuration
        run: |
          set -e

          export PATH="$HOME/toolchains/clang/bin:$PATH"

          rm -rf out
          mkdir -p out

          make \
            O=out \
            ARCH=arm64 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            "$DEFCONFIG"

          make \
            O=out \
            ARCH=arm64 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            olddefconfig

      - name: Build kernel
        run: |
          set -e

          export PATH="$HOME/toolchains/clang/bin:$PATH"

          export ARCH=arm64
          export SUBARCH=arm64

          echo "================================="
          echo "BUILDING SURYA OC KERNEL"
          echo "================================="

          make \
            O=out \
            ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            HOSTCC=gcc \
            HOSTCXX=g++ \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            -j"$(nproc)"

      - name: Check kernel image
        run: |
          set -e

          echo "================================="
          echo "KERNEL OUTPUT"
          echo "================================="

          find out/arch/arm64/boot \
            -maxdepth 2 \
            -type f \
            -printf '%p\n' \
            | sort

          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            echo "KERNEL_IMAGE=Image.gz-dtb" >> "$GITHUB_ENV"

          elif [ -f out/arch/arm64/boot/Image.gz ]; then
            echo "KERNEL_IMAGE=Image.gz" >> "$GITHUB_ENV"

          elif [ -f out/arch/arm64/boot/Image ]; then
            echo "KERNEL_IMAGE=Image" >> "$GITHUB_ENV"

          else
            echo "ERROR: Kernel image was not generated."
            exit 1
          fi

          echo "Selected image:"
          echo "$KERNEL_IMAGE"

      - name: Verify OC source
        run: |
          set -e

          echo "================================="
          echo "OC SOURCE CHECK"
          echo "================================="

          grep -Rni \
            "OVERCLOCK\|2133\|895000000" \
            arch/arm64/boot/dts/qcom \
            2>/dev/null \
            || true

      - name: Check compiler
        run: |
          set -e

          if [ -f out/include/generated/compile.h ]; then
            grep -E \
              "LINUX_COMPILER|LINUX_COMPILE_BY|LINUX_COMPILE_HOST" \
              out/include/generated/compile.h \
              || true
          fi

      - name: Package kernel
        run: |
          set -e

          rm -rf release
          mkdir -p release

          cp \
            "out/arch/arm64/boot/$KERNEL_IMAGE" \
            release/

          if [ -f out/System.map ]; then
            cp out/System.map release/
          fi

          if [ -f out/vmlinux ]; then
            cp out/vmlinux release/
          fi

          cp out/.config release/kernel.config

          cd release
          sha256sum * > SHA256SUMS
          cd ..

          zip -9 -r \
            Surya-OC-Kernel.zip \
            release

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: Surya-OC-Kernel
          path: Surya-OC-Kernel.zip
          if-no-files-found: error
