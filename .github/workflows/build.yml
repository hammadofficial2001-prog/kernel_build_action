name: Build Surya OC Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: 54d2de1a74b791873769799d7afa4b0007dcc2d7
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex build-essential \
            libssl-dev libelf-dev \
            python3 cpio rsync \
            device-tree-compiler \
            clang lld llvm

      - name: Show source
        run: |
          echo "Commit:"
          git rev-parse HEAD
          echo "Kernel tree:"
          ls -la
          echo "Defconfigs:"
          find arch/arm64/configs -type f | grep -Ei 'surya|sm6150|sm7150' || true

      - name: Detect defconfig
        run: |
          set -e

          for cfg in \
            surya_defconfig \
            vendor/surya_defconfig \
            vendor/xiaomi/surya_defconfig \
            sm6150_defconfig \
            sm7150_defconfig
          do
            if [ -f "arch/arm64/configs/$cfg" ]; then
              echo "DEFCONFIG=$cfg" >> "$GITHUB_ENV"
              echo "Using $cfg"
              exit 0
            fi
          done

          echo "No known Surya defconfig found."
          exit 1

      - name: Prepare kernel config
        run: |
          set -e

          mkdir -p out

          make O=out ARCH=arm64 "$DEFCONFIG"

          echo "CONFIG_CC_VERSION_TEXT:"
          grep '^CONFIG_CC_VERSION_TEXT' out/.config || true

          echo 'CONFIG_LOCALVERSION="-OC"' >> out/.config

          make O=out ARCH=arm64 olddefconfig

      - name: Build kernel
        run: |
          set -e

          export ARCH=arm64
          export SUBARCH=arm64
          export LLVM=1
          export LLVM_IAS=1

          make -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1

      - name: Find kernel image
        run: |
          set -e

          echo "Searching kernel images..."

          find out/arch/arm64/boot \
            -maxdepth 3 \
            -type f \
            \( -name 'Image' -o -name 'Image.gz' -o -name 'Image.gz-dtb' -o -name 'dtbo.img' \) \
            -print

          test -f out/arch/arm64/boot/Image

      - name: Package kernel
        run: |
          set -e

          mkdir -p release

          cp out/arch/arm64/boot/Image release/Image

          [ -f out/arch/arm64/boot/Image.gz ] && \
            cp out/arch/arm64/boot/Image.gz release/Image.gz || true

          [ -f out/arch/arm64/boot/Image.gz-dtb ] && \
            cp out/arch/arm64/boot/Image.gz-dtb release/Image.gz-dtb || true

          [ -f out/System.map ] && \
            cp out/System.map release/System.map || true

          cp out/.config release/kernel.config

          sha256sum release/* > release/SHA256SUMS

          cd release
          zip -9 ../Surya-OC-Kernel-54d2de1.zip *
          cd ..

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: Surya-OC-Kernel-54d2de1
          path: |
            Surya-OC-Kernel-54d2de1.zip
            release/
