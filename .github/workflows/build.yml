       - name: Find Defconfig
         id: config
        shell: bash
        run: |
          set -e

          echo "===== ALL DEFCONFIGS ====="

          find arch/arm64/configs -type f -name '*defconfig' -print | sort

          echo
          echo "===== SURYA / XIAOMI / QCOM CONFIGS ====="

          find arch/arm64/configs -type f \
            \( -iname '*surya*' -o -iname '*xiaomi*' -o -iname '*qcom*' -o -iname '*sm7150*' \) \
            -print | sort

          echo
          echo "===== STOPPING HERE ====="
          echo "Copy the output above."
