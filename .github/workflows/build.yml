name: Build Surya OC Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    permissions:
      contents: read

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: andrey167/kernel_xiaomi_surya-msm
          ref: main
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            flex \
            build-essential \
            libssl-dev \
            libelf-dev \
            python3 \
            cpio \
            rsync \
            device-tree-compiler \
            clang \
            lld \
            llvm \
            git

      - name: Add KernelSU
        run: |
          set -e

          rm -rf drivers/kernelsu

          git clone --depth=1 \
            https://github.com/tiann/KernelSU.git \
            drivers/kernelsu

          test -f drivers/kernelsu/Kconfig

          echo "KernelSU Kconfig found:"
          ls -l drivers/kernelsu/Kconfig

      - name: Find Surya defconfig
        run: |
          set -e

          for cfg in \
            surya_defconfig \
            vendor/surya_defconfig \
            vendor/xiaomi/surya_defconfig \
            sm6150_defconfig \
            sm7150_defconfig
          do
            if [ -f "arch/arm64/configs/$cfg" ]; then
              echo "Found: $cfg"
              echo "DEFCONFIG=$cfg" >> "$GITHUB_ENV"
              exit 0
            fi
          done

          echo "ERROR: No Surya defconfig found"
          exit 1

      - name: Prepare configuration
        run: |
          set -e

          mkdir -p out

          make O=out ARCH=arm64 "$DEFCONFIG"

          make O=out ARCH=arm64 olddefconfig

      - name: Build kernel
        run: |
          set -e

          export ARCH=arm64
          export SUBARCH=arm64
          export LLVM=1
          export LLVM_IAS=1

          make \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            -j"$(nproc)"

      - name: Check kernel image
        run: |
          set -e

          find out/arch/arm64/boot \
            -maxdepth 2 \
            -type f \
            -printf '%p\n' | sort

          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            echo "KERNEL_IMAGE=Image.gz-dtb" >> "$GITHUB_ENV"
          elif [ -f out/arch/arm64/boot/Image.gz ]; then
            echo "KERNEL_IMAGE=Image.gz" >> "$GITHUB_ENV"
          elif [ -f out/arch/arm64/boot/Image ]; then
            echo "KERNEL_IMAGE=Image" >> "$GITHUB_ENV"
          else
            echo "ERROR: No kernel image generated"
            exit 1
          fi

      - name: Package kernel
        run: |
          set -e

          mkdir -p release

          cp "out/arch/arm64/boot/$KERNEL_IMAGE" \
            "release/$KERNEL_IMAGE"

          [ -f out/System.map ] && cp out/System.map release/System.map || true
          [ -f out/vmlinux ] && cp out/vmlinux release/vmlinux || true

          cp out/.config release/kernel.config

          cd release
          sha256sum * > SHA256SUMS
          cd ..

          zip -9 -r \
            Surya-OC-Kernel.zip \
            release

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: Surya-OC-Kernel
          path: Surya-OC-Kernel.zip
