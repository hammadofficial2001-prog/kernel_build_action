      - name: Find Surya Qualcomm OPP
        run: |
          cd kernel

          echo "===== SURYA/SM6150 DTS FILES ====="
          find arch/arm64/boot/dts -type f \
            \( -iname '*surya*' -o -iname '*sm6150*' -o -iname '*qcom*' \) \
            | head -200

          echo
          echo "===== CPU OPP: QUALCOMM ONLY ====="
          grep -RniE 'opp-hz|opp-microvolt|cpu[0-9]|cpufreq' \
            arch/arm64/boot/dts/qcom \
            2>/dev/null | grep -E 'sm6150|surya|2304000|1804800' | head -200 || true

          echo
          echo "===== GPU OPP: QUALCOMM ONLY ====="
          grep -RniE '800000000|650000000|565000000|opp-hz|opp-microvolt|gpu|kgsl' \
            arch/arm64/boot/dts/qcom \
            2>/dev/null | head -300 || true

          echo
          echo "===== KGSL FREQUENCY ====="
          grep -RniE '800000000|650000000|565000000|freq_table|gpu_available_frequencies' \
            drivers/gpu \
            2>/dev/null | head -300 || true
