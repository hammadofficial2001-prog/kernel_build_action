name: Surya OPP Diagnostic

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-22.04

    permissions:
      contents: read

    steps:
      - name: Checkout Kernel
        uses: actions/checkout@v4
        with:
          repository: stormbreaker-project/kernel_xiaomi_surya
          ref: staging/main
          path: kernel

      - name: Diagnose CPU GPU OPP
        shell: bash
        run: |
          set -u
          cd kernel

          echo "===== KERNEL COMMIT ====="
          git rev-parse HEAD
          git log -1 --oneline

          echo
          echo "===== SURYA DEFCONFIG ====="
          find arch/arm64/configs -type f \
            \( -iname '*surya*' -o -iname '*sm6150*' \) \
            -print

          echo
          echo "===== SURYA / SM6150 DTS ====="
          find arch/arm64/boot/dts -type f \
            \( -iname '*surya*' -o -iname '*sm6150*' \) \
            -print

          echo
          echo "===== CPU OPP ====="
          grep -RniE \
            'opp-hz|opp-microvolt|1804800|2304000|2457600' \
            arch/arm64/boot/dts/qcom \
            2>/dev/null \
            | head -200 || true

          echo
          echo "===== GPU OPP ====="
          grep -RniE \
            '800000000|650000000|565000000|430000000|opp-hz|kgsl|gpu' \
            arch/arm64/boot/dts/qcom \
            2>/dev/null \
            | head -250 || true

          echo
          echo "===== KGSL SOURCE ====="
          grep -RniE \
            '800000000|650000000|565000000|freq_table|gpu_available_frequencies' \
            drivers/gpu \
            2>/dev/null \
            | head -250 || true

          echo
          echo "===== SURYA REFERENCES ====="
          grep -RniE \
            'surya|sm6150' \
            arch/arm64/boot/dts/qcom \
            2>/dev/null \
            | head -150 || true

          echo
          echo "===== DIAGNOSTIC COMPLETE ====="
