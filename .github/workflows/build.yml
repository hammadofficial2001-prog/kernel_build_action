name: Build POCO X3 NFC Surya Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    permissions:
      contents: read

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            cpio \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            libncurses5-dev \
            python3 \
            python-is-python3 \
            zip \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            binutils-arm-linux-gnueabi

      - name: Clone Surya kernel source
        run: |
          git clone --depth=1 \
            -b staging/main \
            https://github.com/stormbreaker-project/kernel_xiaomi_surya.git \
            kernel

      - name: Verify source
        working-directory: kernel
        run: |
          test -f Makefile
          test -d arch/arm64
          test -f arch/arm64/configs/surya_defconfig
          echo "Kernel source verified"
          git log -1 --oneline

      - name: Install LLVM
        run: |
          sudo apt-get install -y clang llvm lld

      - name: Prepare configuration
        run: |
          cd kernel

          if [ -f ../surya_gilver_defconfig ]; then
            cp ../surya_gilver_defconfig .config
          else
            make O=out ARCH=arm64 surya_defconfig
          fi

          make O=out ARCH=arm64 olddefconfig

          echo "Configuration prepared"
          grep -E '^CONFIG_(ARM64|SMP|SCHED_WALT|PREEMPT|THERMAL)=' out/.config || true

      - name: Build kernel
        working-directory: kernel
        env:
          ARCH: arm64
          LLVM: "1"
          LLVM_IAS: "1"
          CROSS_COMPILE: aarch64-linux-gnu-
          CROSS_COMPILE_ARM32: arm-linux-gnueabi-
        run: |
          make -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-

      - name: Find kernel image
        working-directory: kernel
        run: |
          set -e

          echo "Searching kernel output..."

          find out/arch/arm64/boot \
            -maxdepth 2 \
            -type f \
            \( -name 'Image' -o -name 'Image.gz' -o -name 'Image.gz-dtb' \) \
            -print

          test -f out/arch/arm64/boot/Image || \
          test -f out/arch/arm64/boot/Image.gz || \
          test -f out/arch/arm64/boot/Image.gz-dtb

      - name: Collect build artifacts
        run: |
          mkdir -p release

          cp kernel/out/arch/arm64/boot/Image release/Image 2>/dev/null || true
          cp kernel/out/arch/arm64/boot/Image.gz release/Image.gz 2>/dev/null || true
          cp kernel/out/arch/arm64/boot/Image.gz-dtb release/Image.gz-dtb 2>/dev/null || true

          cp kernel/out/.config release/kernel.config 2>/dev/null || true
          cp kernel/System.map release/System.map 2>/dev/null || true

          cd release
          sha256sum * > SHA256SUMS

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: POCO-X3-Surya-Kernel
          path: release/
          if-no-files-found: error
