 - name: Find Defconfig
  shell: bash
  run: |
    echo "===== ALL DEFCONFIGS ====="
    find arch/arm64/configs -type f -name '*defconfig' -print | sort

    echo
    echo "===== SURYA / KARNA / XIAOMI / QCOM ====="
    find arch/arm64/configs -type f \
      \( -iname '*surya*' -o -iname '*karna*' -o -iname '*xiaomi*' -o -iname '*qcom*' \) \
      -print | sort
